<div class="offers-container">
  <h2 class="offers-heading">💳 Special Card Offers & Discounts</h2>

  <div class="offers-grid">
    <div class="offer-card" *ngFor="let offer of offers">
      <div class="card-logo">
        <img [src]="offer.logo" [alt]="offer.bank" />
      </div>
      <div class="card-details">
        <h3>{{ offer.bank }}</h3>
        <p class="discount">{{ offer.discount }}</p>
        <p class="validity">Valid till {{ offer.validity }}</p>
        <button class="apply-btn">Apply Offer</button>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
